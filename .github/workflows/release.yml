# 自动构建并发布 release
#
# 触发：PR 合并到 main（每次合并都出新 release）
# 跳过：tag push（v* 不再触发，避免与 main 重复）
# 手动：Actions 页 Run workflow + 输入版本号可发指定版本
#
# 版本：默认 v{YYYYMMDD}-{run}（如 v20260623-5），也可手动指定
name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.3，留空用日期+运行号）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: 构建 (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            outfile: mockserver-mac-arm64
            asset_name: mockserver-mac-arm64
          - target: bun-darwin-x64
            outfile: mockserver-mac-x64
            asset_name: mockserver-mac-x64
          - target: bun-windows-x64
            outfile: mockserver-win-x64.exe
            asset_name: mockserver-win-x64.exe
          - target: bun-windows-arm64
            outfile: mockserver-win-arm64.exe
            asset_name: mockserver-win-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 构建 (${{ matrix.target }})
        run: bun build.mjs ${{ matrix.target }} ${{ matrix.outfile }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.outfile }}
          if-no-files-found: error

  desktop:
    name: 桌面安装包 (${{ matrix.asset_name }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            sidecar_artifact: mockserver-mac-arm64
            triple: aarch64-apple-darwin
            bundles: dmg
            asset_name: mac-arm64
          - os: macos-13
            sidecar_artifact: mockserver-mac-x64
            triple: x86_64-apple-darwin
            bundles: dmg
            asset_name: mac-x64
          - os: windows-latest
            sidecar_artifact: mockserver-win-x64.exe
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            asset_name: win-x64
          - os: windows-latest
            sidecar_artifact: mockserver-win-arm64.exe
            triple: aarch64-pc-windows-msvc
            bundles: nsis
            asset_name: win-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: 下载 sidecar 产物
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sidecar_artifact }}
          path: sidecar-stage

      - name: 放置 sidecar（按 target triple 命名）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          SRC=$(find sidecar-stage -type f | head -1)
          case "${{ matrix.triple }}" in
            *windows*) EXT=.exe ;;
            *) EXT= ;;
          esac
          cp "$SRC" "src-tauri/binaries/mockserver-${{ matrix.triple }}${EXT}"
          chmod +x "src-tauri/binaries/mockserver-${{ matrix.triple }}${EXT}" || true
          ls -la src-tauri/binaries

      - name: 同步版本号到 tauri.conf.json
        run: |
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('package.json','utf8')).version;const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=v;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')"

      - name: 壳单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: tauri build
        run: pnpm tauri build --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset_name }}
          path: |
            src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.triple }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 决定版本号
        id: meta
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            # 手动触发 + 输入版本号（跳过 auto-bump）
            VER="${{ inputs.version }}"
          else
            # 自动：读 package.json → bump patch
            CUR=$(node -p "require('./package.json').version")
            MAJOR=$(echo "$CUR" | cut -d. -f1)
            MINOR=$(echo "$CUR" | cut -d. -f2)
            PATCH=$(echo "$CUR" | cut -d. -f3)
            VER="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=v${VER}"

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成 SHA256SUMS
        run: |
          cd artifacts
          sha256sum mockserver-* *.dmg *-setup.exe > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/mockserver-mac-arm64
            artifacts/mockserver-mac-x64
            artifacts/mockserver-win-x64.exe
            artifacts/mockserver-win-arm64.exe
            artifacts/*.dmg
            artifacts/*-setup.exe
            artifacts/SHA256SUMS
          body: |
            ## 桌面版（推荐）

            标准桌面应用：独立窗口、关窗最小化到托盘、托盘菜单可重启服务。

            | 平台 | 文件 |
            |---|---|
            | macOS (Apple Silicon) | `Mock Tools_*_aarch64.dmg` |
            | macOS (Intel) | `Mock Tools_*_x64.dmg` |
            | Windows (x64) | `Mock Tools_*_x64-setup.exe` |
            | Windows (ARM) | `Mock Tools_*_arm64-setup.exe` |

            > macOS 未签名：首次打开请右键 App →「打开」。

            ## 命令行版（单文件可执行）

            | 平台 | 文件 |
            |---|---|
            | macOS (Apple Silicon) | `mockserver-mac-arm64` |
            | macOS (Intel) | `mockserver-mac-x64` |
            | Windows (x64) | `mockserver-win-x64.exe` |
            | Windows (ARM) | `mockserver-win-arm64.exe` |

            ## 校验

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ## 运行（命令行版）

            ```bash
            # macOS
            chmod +x mockserver-mac-arm64
            ./mockserver-mac-arm64

            # Windows
            mockserver-win-x64.exe
            ```

            首次启动会在 `~/Documents/mock-server-webui-trace.log` 写调试日志。
            默认监听 `http://127.0.0.1:5050`，自动打开浏览器。

            > LAN 访问：`MOCK_HOST=0.0.0.0 ./mockserver-mac-arm64`
